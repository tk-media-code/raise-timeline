spring.application.name=raise-timeline

# DB の接続情報は docker-compose.yml が環境変数で渡す。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 接続プールから接続を借りるまでの待ち時間の上限（ミリ秒）。既定は 30 秒。
# DB に届かないとき、GET /api/health が 30 秒待たされずに 503 を返せるよう 5 秒にしている。
spring.datasource.hikari.connection-timeout=5000

# SQL は Mapper インターフェースに書かず、XML に統一する。その置き場所を MyBatis に教える。
mybatis.mapper-locations=classpath:mapper/**/*.xml
# DB は snake_case の列名、Java は camelCase のフィールド名なので、自動で対応づけて列ごとの別名指定を要らなくする。
mybatis.configuration.map-underscore-to-camel-case=true

# アクセストークン（JWT）の署名鍵（HS256、Base64 の 32 バイト以上）。コードや properties に実値を書かず、環境変数で渡す。
# 未設定のままだと ${JWT_SECRET} という文字列が渡ってくるので、AuthProperties が起動時に検査して止める。
# 本番で渡し忘れても、既定の鍵で動き続けないようにするため。
auth.jwt-secret=${JWT_SECRET}
# アクセストークンの有効期間。短くして、盗まれても使える時間を限る。切れたらリフレッシュトークンで取り直す。
auth.access-token-ttl=PT1H
# リフレッシュトークンの有効期間。この間はログインし直さずに済む。
auth.refresh-token-ttl=P30D
# リフレッシュトークンを入れる Cookie の名前。
auth.cookie-name=refresh_token
# Cookie に Secure を付けるか。本番は HTTPS なので true。環境変数が無いときは true にして、渡し忘れても安全側に倒す。
# ローカルは http://localhost なので docker-compose.yml が false を渡す。
auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
# JWT の発行者（iss）。自分が発行したトークンだけを受け入れるために、検証でも同じ値を使う。
auth.issuer=raise-timeline
# 戻り値が record（コンストラクタで組み立てる型）のとき、列名と引数名を対応づけて結果を詰める。setter を持たない型を使うため。
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
# MyBatis は UUID の TypeHandler を持たない（UUID をコンストラクタで組み立てる型と見て失敗する）。自前の UuidTypeHandler を登録する。
mybatis.type-handlers-package=com.tkmedia.raisetimeline.mapper.handler

# ログは標準出力へ、1 行 1 件の ECS 形式の JSON で出す。ローカルも本番と同じ形にして、
# AI がローカルで読んだ経験を本番でそのまま使え、行が壊れる不具合もローカルで見つけられるようにする。
logging.structured.format.console=ecs
# 環境名。本番は環境変数 APP_ENV に production を渡す。未設定ならローカル。
logging.structured.ecs.service.environment=${APP_ENV:local}
# 例外のスタックトレースは根本原因（cause）を先頭にする。調べる人が最初に見たいのは根本原因なので。
logging.structured.json.stacktrace.root=first
# CloudWatch Logs は 1 件 256 KB が上限。長いスタックトレースで超えて行が切れないようにする保険。
logging.structured.json.stacktrace.max-length=65536
# 起動時の ASCII アートは JSON ではない。標準出力を JSON だけにするために消す。
spring.main.banner-mode=off
# アプリのログの水準。環境変数が無いときは INFO にして、本番で渡し忘れても DEBUG にならないようにする。
# ローカルは docker-compose.yml が DEBUG を渡す（MyBatis の SQL も Mapper のパッケージの下で出る）。
logging.level.com.tkmedia.raisetimeline=${LOG_LEVEL_APP:INFO}
# 本番は nginx の後ろで動く。X-Forwarded-For から利用者の IP を復元し、client.ip を nginx の IP にしない。
server.forward-headers-strategy=native
# 405 などの 4xx で Spring MVC が出す WARN を止める。4xx は要求ログの status と code で足りる（重複させない）。
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
# DevTools が開発時に true にし、例外を解決するたび（4xx も 500 も）に「Resolved [...]」の WARN を出す。
# 4xx は要求ログの 1 行だけにし、500 の ERROR と WARN を重ねない（docs/logging-design.md 2 章の規則 1・2）。
spring.mvc.log-resolved-exception=false
# API は JSON と multipart だけ（docs/api-conventions.md 1 章）。form の本文を PUT/PATCH/DELETE で読む FormContentFilter は要らず、
# 壊れた form の本文で MVC の外から 500 を起こせる口になるので切る。
spring.mvc.formcontent.filter.enabled=false
