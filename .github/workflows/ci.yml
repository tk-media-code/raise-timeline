# main への PR と push のたびに、まっさらな環境でビルドが通ることだけを確かめる。
# 静的解析とテストは、ここでは走らせない。push 前の品質チェック
# （scripts/quality-check.cjs）が受け持つ。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (compile + package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # testClasses を足しているのは、テストコードがコンパイルできなくなったことに
      # assemble だけでは気づけないため。テストの実行はしない。
      - name: Compile and package
        working-directory: backend
        run: ./gradlew assemble testClasses --console=plain

  frontend:
    name: Frontend (type check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
